name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/tea_ledger_mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/tea_ledger_mobile/**"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: mobile/tea_ledger_mobile

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test
