name: Admin Web CI

on:
  push:
    branches: [main]
    paths:
      - "admin-web/**"
      - ".github/workflows/admin-web.yml"
  pull_request:
    branches: [main]
    paths:
      - "admin-web/**"
      - ".github/workflows/admin-web.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: admin-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
