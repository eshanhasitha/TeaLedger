$kind: http-request
name: Collector creates farmer
url: "{{baseUrl}}/api/collector/farmers"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "userId": "{{userId}}",
      "farmerCode": "{{farmerCode}}",
      "address": "{{address}}",
      "farmSizeHectares": {{farmSizeHectares}}
    }
auth:
  type: bearer
  credentials:
    token: "{{collectorAccessToken}}"
order: 3000
