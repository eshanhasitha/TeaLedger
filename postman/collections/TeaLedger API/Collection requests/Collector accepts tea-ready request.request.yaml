$kind: http-request
name: Collector accepts tea-ready request
url: "{{baseUrl}}/api/collection-requests/{{collectionRequestId}}/decision"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "decision": "accept",
      "note": "{{collectorNote}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{collectorAccessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Collector accepts the request", function () {
          pm.response.to.have.status(200);
      });
order: 4000
