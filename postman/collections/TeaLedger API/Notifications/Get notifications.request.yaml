$kind: http-request
name: Get my notifications
url: "{{baseUrl}}/api/notifications"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{farmerAccessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Notifications are returned", function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json()).to.be.an("array");
      });
      const rows = pm.response.json();
      if (rows.length && rows[0].id) {
          pm.environment.set("notificationId", rows[0].id);
      }
order: 2000
