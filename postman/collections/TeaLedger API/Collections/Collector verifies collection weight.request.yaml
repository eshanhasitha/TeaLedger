$kind: http-request
name: Collector verifies collection weight
url: "{{baseUrl}}/api/collections/{{collectionId}}/verify-weight"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "grossWeight": {{grossWeight}},
      "waterReduction": {{waterReduction}},
      "bagWeight": {{bagWeight}},
      "otherReduction": {{otherReduction}}
    }
auth:
  type: bearer
  credentials:
    token: "{{collectorAccessToken}}"
order: 2000
