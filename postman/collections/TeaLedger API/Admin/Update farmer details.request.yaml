$kind: http-request
url: "{{baseUrl}}/api/admin/farmers/{{farmerId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "farmerCode": "{{farmerCode}}",
      "address": "{{address}}",
      "farmSizeHectares": {{farmSizeHectares}}
    }
auth:
  type: inherit
order: 3000
