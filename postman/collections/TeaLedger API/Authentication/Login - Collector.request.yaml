$kind: http-request
name: Collector login
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "phoneNumber": "{{collectorPhoneNumber}}",
      "password": "{{collectorPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          const body = pm.response.json();
          if (body.accessToken) {
              pm.environment.set("accessToken", body.accessToken);
              pm.environment.set("collectorAccessToken", body.accessToken);
          }
      }
      pm.test("Collector login returns an access token", function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json().accessToken).to.be.a("string").and.not.empty;
          pm.expect(pm.response.json().role).to.eql("Collector");
      });
order: 3100
