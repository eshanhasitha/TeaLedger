$kind: http-request
name: Admin creates collector
url: "{{baseUrl}}/api/admin/collectors"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "{{fullName}}",
      "phoneNumber": "{{collectorPhoneNumber}}",
      "password": "{{collectorPassword}}",
      "address": "{{address}}",
      "area": "{{area}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminAccessToken}}"
order: 3000
